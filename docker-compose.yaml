version: '3.8'

services:
  test_py310_dj52:
    image: python:3.10-slim-bullseye
    environment:
      - PYTHONWARNINGS=always
    volumes:
      - .:/django-heartbeat
    command: sh -c "
      cd django-heartbeat;
      pip install 'Django>=5.2,<5.3' pytest pytest-html;
      pip install -e .;
      pytest tests -vv --html=./test-results_py310_dj52.html --self-contained-html
      "

  test_py311_dj52:
    image: python:3.11-slim-bullseye
    environment:
      - PYTHONWARNINGS=always
    volumes:
      - .:/django-heartbeat
    command: sh -c "
